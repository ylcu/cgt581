<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group Related Tabs Into Pages</title>
  <style>
    :root {
      --app-bg: #c8cdd6;
      --title-bg: #3c4a5c;
      --tabs-bg: #d8dce4;
      --panel-border: #b0b8c4;
      --panel-head: #e8eaed;
      --monitor-bg: #0b1929;
      --monitor-head: #0d2040;
      --monitor-line: #1e3050;
      --body-font: Inter, Arial, Helvetica, sans-serif;
      --mono-font: "JetBrains Mono", Consolas, "Courier New", monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--body-font);
      background: var(--app-bg);
      color: #111;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--app-bg);
      user-select: none;
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      background: var(--title-bg);
      color: white;
      flex: 0 0 auto;
    }
    .app-icon {
      width: 16px;
      height: 16px;
      border: 1px solid #8a9ab0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }
    .app-icon::after {
      content: "";
      width: 8px;
      height: 8px;
      background: #8a9ab0;
      border-radius: 50%;
    }
    .titlebar h1 {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .03em;
      flex: 1;
    }

    .pagebar {
      display: flex;
      align-items: stretch;
      background: var(--tabs-bg);
      border-bottom: 1px solid #9aa0aa;
      flex: 0 0 auto;
    }
    .page-tab {
      border: 0;
      border-right: 1px solid var(--panel-border);
      background: transparent;
      color: #444;
      padding: 5px 16px;
      font-size: 11px;
      font-weight: 500;
    }
    .page-tab:hover { background: #c8cdd6; }
    .page-tab.active {
      background: var(--title-bg);
      color: white;
    }
    .pagebar-spacer { flex: 1; }
    .page-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
    }
    .key-button {
      border: 0;
      background: transparent;
      padding: 0;
      color: #555;
    }
    .key-button:hover { color: #111; }
    kbd {
      display: inline-block;
      padding: 1px 5px;
      background: #c8cdd6;
      border: 1px solid #9aa0aa;
      font-family: var(--mono-font);
      font-size: 9px;
    }
    .counter {
      font-family: var(--mono-font);
      font-size: 9px;
      color: #777;
    }

    .main {
      flex: 1;
      min-height: 0;
      padding: 4px;
    }
    .layout {
      width: 100%;
      height: 100%;
      display: grid;
      gap: 1px;
      background: var(--panel-border);
    }
    .layout-all {
      grid-template-rows: 1fr 1fr;
      grid-template-columns: 1fr 1fr 1.4fr;
    }
    .layout-cpr {
      grid-template-columns: 1fr 1.4fr;
    }
    .layout-misc {
      grid-template-rows: 1fr 1fr;
      grid-template-columns: 1fr 1fr;
    }
    .span-rows { grid-row: span 2; }
    .span-cols { grid-column: span 2; }

    .panel {
      background: white;
      border: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 8px;
      border-bottom: 1px solid var(--panel-border);
      background: var(--panel-head);
      flex: 0 0 auto;
    }
    .panel-header span {
      font-size: 11px;
      color: #333;
      font-weight: 500;
    }
    .collapse {
      border: 0;
      background: transparent;
      color: #555;
      font-size: 11px;
      line-height: 1;
      padding: 0 2px;
    }
    .panel-body {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .empty-label {
      font-size: 11px;
      color: #bbb;
      font-style: italic;
    }

    .control-stack {
      width: 100%;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .eye-row {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .select-row {
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }
    select {
      border: 1px solid #aaa;
      background: white;
      color: #333;
      font-size: 10px;
      padding: 2px 4px;
    }
    .chest-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chest-control label {
      font-size: 10px;
      color: #555;
    }

    .monitor {
      border: 1px solid var(--panel-border);
      background: var(--monitor-bg);
      color: white;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .monitor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 8px;
      border-bottom: 1px solid var(--monitor-line);
      background: var(--monitor-head);
      flex: 0 0 auto;
    }
    .monitor-header span {
      font-size: 11px;
      color: #8fa8c8;
      font-weight: 500;
    }
    .monitor-header .collapse { color: #556; }
    .monitor-header .collapse:hover { color: white; }
    .monitor-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .vitals {
      padding: 8px 12px 0;
      flex: 0 0 auto;
    }
    .vital-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #1a2e4a;
    }
    .vital-tag {
      width: 56px;
      flex: 0 0 56px;
      font-family: var(--mono-font);
      font-size: 9px;
      color: #4a6a8a;
    }
    .vital-values {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-left: auto;
    }
    .vital-label {
      font-size: 11px;
      font-weight: 500;
    }
    .vital-value {
      font-family: var(--mono-font);
      font-size: 24px;
      font-weight: 700;
    }
    .lower-vitals {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 12px;
      margin-top: 8px;
      border-top: 1px solid var(--monitor-line);
      border-bottom: 1px solid var(--monitor-line);
      flex: 0 0 auto;
    }
    .lower-vitals span {
      font-family: var(--mono-font);
      font-size: 10px;
      color: #8fa8c8;
    }
    .monitor-tabs {
      display: flex;
      border-bottom: 1px solid var(--monitor-line);
      flex: 0 0 auto;
    }
    .monitor-tab {
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: #8fa8c8;
      padding: 5px 12px 4px;
      font-size: 10px;
      font-weight: 500;
    }
    .monitor-tab:hover { color: white; }
    .monitor-tab.active {
      color: white;
      border-bottom-color: #00ccff;
    }
    .monitor-tabs .spacer { flex: 1; }
    .monitor-chart-wrap {
      flex: 1;
      min-height: 0;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .monitor-chart {
      width: 100%;
      height: 100%;
      border: 1px dashed #2a4060;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3a5070;
      font-size: 10px;
      font-style: italic;
      text-align: center;
    }
    .session-log {
      border-top: 1px solid var(--monitor-line);
      padding: 6px 12px;
      flex: 0 0 auto;
    }
    .session-log-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .session-log-head span:first-child {
      font-size: 10px;
      color: #8fa8c8;
    }
    .session-link {
      font-size: 10px;
      color: #3a60a0;
      text-decoration: underline;
      cursor: pointer;
    }
    .log-lines {
      font-family: var(--mono-font);
      font-size: 9px;
      line-height: 1.45;
      color: #5a7a9a;
    }

    @media (max-width: 680px) {
      .layout-all { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1.4fr; }
      .layout-all .monitor { grid-column: span 2; grid-row: auto; }
      .layout-cpr { grid-template-columns: 1fr; grid-template-rows: 1fr 1.4fr; }
      .page-tab { padding-inline: 10px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="titlebar">
      <div class="app-icon" aria-hidden="true"></div>
      <h1>Group Related Tabs Into Pages</h1>
    </div>

    <div class="pagebar" role="tablist" aria-label="Page selection">
      <button class="page-tab active" data-page="all" role="tab" aria-selected="true">All</button>
      <button class="page-tab" data-page="cpr" role="tab" aria-selected="false">CPR Mode</button>
      <button class="page-tab" data-page="misc" role="tab" aria-selected="false">Misc Mode</button>
      <div class="pagebar-spacer"></div>
      <div class="page-controls">
        <button class="key-button" id="prevPage" title="Previous page ([)"><kbd>[</kbd></button>
        <button class="key-button" id="nextPage" title="Next page (])"><kbd>]</kbd></button>
        <span class="counter" id="pageCounter">1/3</span>
      </div>
    </div>

    <main class="main" id="mainArea"></main>
  </div>

  <template id="emptyPanelTemplate">
    <section class="panel">
      <div class="panel-header"><span class="panel-title"></span><button class="collapse" aria-label="Collapse">—</button></div>
      <div class="panel-body"><span class="empty-label">No content</span></div>
    </section>
  </template>

  <template id="eyesTemplate">
    <section class="panel">
      <div class="panel-header"><span>[ Eyes ]</span><button class="collapse" aria-label="Collapse">—</button></div>
      <div class="panel-body">
        <div class="control-stack">
          <div class="eye-row">
            <svg width="52" height="36" viewBox="0 0 52 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Left eye">
              <ellipse cx="26" cy="18" rx="25" ry="17" stroke="#333" stroke-width="1.5" fill="white"/>
              <circle cx="26" cy="18" r="10" stroke="#333" stroke-width="1.5" fill="white"/>
              <circle cx="26" cy="18" r="6" fill="#4a3728"/><circle cx="26" cy="18" r="3" fill="#111"/><circle cx="29" cy="15" r="1.5" fill="white"/>
            </svg>
            <svg width="52" height="36" viewBox="0 0 52 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Right eye">
              <ellipse cx="26" cy="18" rx="25" ry="17" stroke="#333" stroke-width="1.5" fill="white"/>
              <circle cx="26" cy="18" r="10" stroke="#333" stroke-width="1.5" fill="white"/>
              <circle cx="26" cy="18" r="6" fill="#4a3728"/><circle cx="26" cy="18" r="3" fill="#111"/><circle cx="29" cy="15" r="1.5" fill="white"/>
            </svg>
          </div>
          <div class="select-row">
            <select aria-label="Eye opening"><option>Wide open</option><option>Normal</option><option>Constricted</option><option>Pinpoint</option></select>
            <select aria-label="Eye response"><option>Normal</option><option>Sluggish</option><option>Fixed</option></select>
          </div>
        </div>
      </div>
    </section>
  </template>

  <template id="chestTemplate">
    <section class="panel">
      <div class="panel-header"><span>[ Chest rise ]</span><button class="collapse" aria-label="Collapse">—</button></div>
      <div class="panel-body">
        <div class="control-stack">
          <svg width="60" height="72" viewBox="0 0 60 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Torso">
            <path d="M10 12 Q6 20 5 36 Q4 52 8 68 L52 68 Q56 52 55 36 Q54 20 50 12 Q42 4 30 4 Q18 4 10 12Z" stroke="#555" stroke-width="1.5" fill="#f5f5f5"/>
            <rect x="22" y="2" width="16" height="12" rx="3" stroke="#555" stroke-width="1.5" fill="#f5f5f5"/>
            <line x1="30" y1="16" x2="30" y2="50" stroke="#888" stroke-width="1" stroke-dasharray="2 2"/>
            <ellipse cx="19" cy="36" rx="9" ry="14" stroke="#888" stroke-width="1" fill="none"/>
            <ellipse cx="41" cy="36" rx="9" ry="14" stroke="#888" stroke-width="1" fill="none"/>
          </svg>
          <div class="chest-control">
            <label for="chestRiseSelect">Chest Rise</label>
            <select id="chestRiseSelect"><option>Normal</option><option>Reduced</option><option>Absent</option><option>Paradoxical</option></select>
          </div>
        </div>
      </div>
    </section>
  </template>

  <template id="monitorTemplate">
    <section class="monitor">
      <div class="monitor-header"><span>[ Monitor ]</span><button class="collapse" aria-label="Collapse">—</button></div>
      <div class="monitor-body">
        <div class="vitals">
          <div class="vital-row">
            <span class="vital-tag">[ ECG ]</span>
            <div class="vital-values"><span class="vital-label" style="color:#00e5a0">HR</span><span class="vital-value" style="color:#00e5a0">80</span></div>
          </div>
          <div class="vital-row">
            <span class="vital-tag">[ SpO2 ]</span>
            <div class="vital-values"><span class="vital-label" style="color:rgb(255,251,0)">SpO2</span><span class="vital-value" style="color:rgb(255,251,0)">98</span></div>
          </div>
          <div class="vital-row">
            <span class="vital-tag">[ ABP ]</span>
            <div class="vital-values"><span class="vital-label" style="color:#ff4444">120/80</span><span class="vital-value" style="color:#ff4444">(93)</span></div>
          </div>
        </div>
        <div class="lower-vitals"><span>PAP 23/12</span><span>CO2 34</span></div>
        <div class="monitor-tabs">
          <button class="monitor-tab active" data-monitor-tab="Prediction">Prediction</button>
          <button class="monitor-tab" data-monitor-tab="Trends">Trends</button>
          <button class="monitor-tab" data-monitor-tab="Cardiac">Cardiac</button>
          <div class="spacer"></div><button class="collapse" aria-label="Collapse">—</button>
        </div>
        <div class="monitor-chart-wrap"><div class="monitor-chart">[ Prediction Trend Chart Wireframe ]</div></div>
        <div class="session-log">
          <div class="session-log-head"><span>Session log</span><span class="session-link">Local MI Status</span></div>
          <div class="log-lines"><div>MI: SELFORGLYML</div><div>Status: Connexion faulty</div></div>
        </div>
      </div>
    </section>
  </template>

  <script>
    (() => {
      const pages = ['all', 'cpr', 'misc'];
      let pageIndex = 0;
      const main = document.getElementById('mainArea');
      const tabs = [...document.querySelectorAll('.page-tab')];
      const counter = document.getElementById('pageCounter');

      function cloneTemplate(id) {
        return document.getElementById(id).content.firstElementChild.cloneNode(true);
      }

      function emptyPanel(label) {
        const node = cloneTemplate('emptyPanelTemplate');
        node.querySelector('.panel-title').textContent = `[ ${label} ]`;
        return node;
      }

      function eyesPanel() { return cloneTemplate('eyesTemplate'); }
      function chestPanel() { return cloneTemplate('chestTemplate'); }

      function monitorPanel() {
        const node = cloneTemplate('monitorTemplate');
        const monitorTabs = [...node.querySelectorAll('.monitor-tab')];
        const chart = node.querySelector('.monitor-chart');
        const labels = {
          Prediction: '[ Prediction Trend Chart Wireframe ]',
          Trends: '[ Trends Chart ]',
          Cardiac: '[ Cardiac Chart ]'
        };
        monitorTabs.forEach(tab => {
          tab.addEventListener('click', () => {
            monitorTabs.forEach(t => t.classList.toggle('active', t === tab));
            chart.textContent = labels[tab.dataset.monitorTab];
          });
        });
        return node;
      }

      function render() {
        main.replaceChildren();
        const page = pages[pageIndex];
        const layout = document.createElement('div');
        layout.classList.add('layout');

        if (page === 'all') {
          layout.classList.add('layout-all');
          layout.append(emptyPanel('Panel L1'));
          layout.append(emptyPanel('Panel M1'));
          const monitor = monitorPanel();
          monitor.classList.add('span-rows');
          layout.append(monitor);
          layout.append(eyesPanel());
          layout.append(chestPanel());
        } else if (page === 'cpr') {
          layout.classList.add('layout-cpr');
          layout.append(emptyPanel('Panel M1'));
          layout.append(monitorPanel());
        } else {
          layout.classList.add('layout-misc');
          const l1 = emptyPanel('Panel L1');
          l1.classList.add('span-cols');
          layout.append(l1);
          layout.append(eyesPanel());
          layout.append(chestPanel());
        }

        main.append(layout);
        tabs.forEach((tab, i) => {
          const active = i === pageIndex;
          tab.classList.toggle('active', active);
          tab.setAttribute('aria-selected', active ? 'true' : 'false');
        });
        counter.textContent = `${pageIndex + 1}/${pages.length}`;
      }

      function previousPage() {
        pageIndex = (pageIndex - 1 + pages.length) % pages.length;
        render();
      }
      function nextPage() {
        pageIndex = (pageIndex + 1) % pages.length;
        render();
      }

      tabs.forEach((tab, i) => tab.addEventListener('click', () => { pageIndex = i; render(); }));
      document.getElementById('prevPage').addEventListener('click', previousPage);
      document.getElementById('nextPage').addEventListener('click', nextPage);

      window.addEventListener('keydown', (event) => {
        const tag = event.target && event.target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

        if (event.key === '[' || (event.key === 'Tab' && event.shiftKey)) {
          event.preventDefault();
          previousPage();
        } else if (event.key === ']' || (event.key === 'Tab' && !event.shiftKey && !event.ctrlKey && !event.metaKey && !event.altKey)) {
          event.preventDefault();
          nextPage();
        } else if (['1','2','3'].includes(event.key)) {
          pageIndex = Number(event.key) - 1;
          render();
        }
      });

      render();
    })();
  </script>
</body>
</html>
